<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stone paper scissor</title>

    <link rel="stylesheet" href="style.css"> </link>

</head>
<body>
     
    <h1>Rock Paper Scissors</h1>

     <div class="choices">

        <div class="choice" id="rock">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRpv2fmJezT1pb2Jrv2aDYl-ZLWGp85JytGaioYXCQ-5RF77vENynGsIAw&s=10"> </img>
        </div>

        <div class="choice" id="paper">
            <img src="https://media.geeksforgeeks.org/wp-content/uploads/20210705223645/paper.jpeg"></img>
        </div>

        <div class="choice" id="scissor">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTaxCNw-twHd2zCCLjPwKfWQL01Co1faqXVLJ4si3qMJQ&s=10"></img>
        </div>

    </div>

    <div class="score-board">

        <div class="source">
            <p id="user-score">0</p>
            <p>You</p>
        </div>

        <div class="source">
            <p id="comp-score">0</p>
            <p>computer</p>
        </div>

    </div>


    <div class="msg-container">
        <p id="msg">play your move</p>
    </div>




















</body>

<script src="aap.js"></script>

</html>
