<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stone paper scissor</title>

    <link rel="stylesheet" href="style.css"> </link>

</head>
<body>
     
    <h1>Rock Paper Scissors</h1>

     <div class="choices">

        <div class="choice" id="rock">
            <img src="https://github.com/shradha-khapra/JavaScriptSeries/blob/main/StonePaperScissors/images/rock.png?raw=true"></img>        
        </div>    

        <div class="choice" id="paper">
            <img src="https://github.com/shradha-khapra/JavaScriptSeries/blob/main/StonePaperScissors/images/paper.png?raw=true"></img>
        </div>    

        <div class="choice" id="scissor">
            <img src="https://github.com/shradha-khapra/JavaScriptSeries/blob/main/StonePaperScissors/images/scissors.png?raw=true"></img>
        </div>

    </div>

    <div class="score-board">

        <div class="source">
            <p id="user-score">0</p>
            <p>You</p>
        </div>

        <div class="source">
            <p id="comp-score">0</p>
            <p>computer</p>
        </div>

    </div>


    <div class="msg-container">
        <p id="msg">play your move</p>
    </div>


</body>

<script src="app.js"></script>

</html>
